services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: testing
      APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      PAO_DISABLE: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: moeller_lars_testing
      DB_USERNAME: postgres
      DB_PASSWORD: moeller_lars_local
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moeller_lars_testing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moeller_lars_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moeller_lars_testing"]
      interval: 2s
      timeout: 5s
      retries: 15
