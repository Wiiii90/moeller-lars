name: Temporary final SiteSection runtime fix

on:
  push:
    branches:
      - tmp/site-section-last-runtime-fix-20260820

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining legacy publication readers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'pattern not found enough times in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'app/Domain/Artwork/ArtworkEditorialService.php',
              "use App\\Models\\MediaAsset;\n",
              "use App\\Models\\MediaAsset;\nuse App\\Models\\SiteSection;\n",
          )
          replace(
              'app/Domain/Artwork/ArtworkEditorialService.php',
              "$fresh = Artwork::query()->with(['category', 'artworkMedia.mediaAsset'])->findOrFail($artwork->getKey());",
              "$fresh = Artwork::query()->with(['category.siteSection', 'artworkMedia.mediaAsset'])->findOrFail($artwork->getKey());",
          )
          replace(
              'app/Domain/Artwork/ArtworkEditorialService.php',
              "$category = $fresh->category()->first();\n        $mediaAsset = $primary?->getRelation('mediaAsset');",
              "$category = $fresh->getRelationValue('category');\n        $siteSection = $category?->getRelationValue('siteSection');\n        $mediaAsset = $primary?->getRelation('mediaAsset');",
          )
          replace(
              'app/Domain/Artwork/ArtworkEditorialService.php',
              "            ! $category\n            || $category->getAttribute('state') !== 'published'\n",
              "            ! $category\n            || ! $siteSection instanceof SiteSection\n            || $siteSection->getAttribute('state') !== 'published'\n",
          )

          replace(
              'app/Domain/Analytics/ArtworkAttentionReport.php',
              "use App\\Models\\MediaVariant;\n",
              "use App\\Models\\MediaVariant;\nuse App\\Models\\SiteSection;\n",
          )
          replace(
              'app/Domain/Analytics/ArtworkAttentionReport.php',
              "->with(['category', 'artworkMedia.mediaAsset.variants'])",
              "->with(['category.siteSection', 'artworkMedia.mediaAsset.variants'])",
          )
          replace(
              'app/Domain/Analytics/ArtworkAttentionReport.php',
              """            $category = $artwork->getRelationValue('category');\n            $isPublic = $artwork->getAttribute('state') === 'published'\n                && $category?->getAttribute('state') === 'published';\n""",
              """            $category = $artwork->getRelationValue('category');\n            $siteSection = $category?->getRelationValue('siteSection');\n            $isPublic = $artwork->getAttribute('state') === 'published'\n                && $siteSection instanceof SiteSection\n                && $siteSection->getAttribute('state') === 'published';\n""",
          )

          replace(
              'tests/Feature/ArtworkCategoryHierarchyTest.php',
              "$section = $category->siteSection()->firstOrFail();\n\n    $published =",
              "$section = $category->siteSection()->firstOrFail();\n    $legacyState = $category->getRawOriginal('state');\n\n    $published =",
          )
          replace(
              'tests/Feature/ArtworkCategoryHierarchyTest.php',
              "->and($category->fresh()->getAttribute('state'))->toBe('draft');",
              "->and($category->fresh()->getRawOriginal('state'))->toBe($legacyState);",
              2,
          )

          replace(
              'tests/Feature/SitePagesWorkspaceTest.php',
              "$section = testGallerySection($gallery, ['state' => 'hidden', 'position' => 210]);\n\n    Livewire::test",
              "$section = testGallerySection($gallery, ['state' => 'hidden', 'position' => 210]);\n    $legacyGalleryState = $gallery->getRawOriginal('state');\n\n    Livewire::test",
          )
          replace(
              'tests/Feature/SitePagesWorkspaceTest.php',
              "->and($freshCategory->getRawOriginal('state'))->toBe('draft')",
              "->and($freshCategory->getRawOriginal('state'))->toBe($legacyGalleryState)",
          )
          replace(
              'tests/Feature/SitePagesWorkspaceTest.php',
              """    testGallerySection($child, [\n        'state' => 'published',\n        'show_in_navigation' => true,\n        'parent_id' => $parentSection->id,\n        'position' => 10,\n    ]);\n\n    Livewire::test""",
              """    testGallerySection($child, [\n        'state' => 'published',\n        'show_in_navigation' => true,\n        'parent_id' => $parentSection->id,\n        'position' => 10,\n    ]);\n    $legacyParentState = $parent->getRawOriginal('state');\n\n    Livewire::test""",
          )
          replace(
              'tests/Feature/SitePagesWorkspaceTest.php',
              "->and($parent->fresh()->getRawOriginal('state'))->toBe('draft');",
              "->and($parent->fresh()->getRawOriginal('state'))->toBe($legacyParentState);",
          )
          PY

          rm .github/workflows/_tmp-site-section-last-runtime-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove final legacy publication readers"
          git push origin HEAD:tmp/site-section-last-runtime-fix-20260820
