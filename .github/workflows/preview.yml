name: Build validation preview image

run-name: Validation preview ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to build for Validation preview
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: validation-preview-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Resolve and validate preview source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Validation preview refuses commits already reachable from main. Use release.yml for main/release artifacts."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wiiii90/moeller-lars:${{ steps.source.outputs.sha }}
          build-args: |
            APP_GIT_SHA=${{ steps.source.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record preview identity
        run: |
          echo "### moeller-lars Validation preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only - not release-qualified." >> "$GITHUB_STEP_SUMMARY"
          echo "Git SHA: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`ghcr.io/wiiii90/moeller-lars:${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
