name: Temporary static analysis cleanup 2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/static-analysis-cleanup-2.yml'

permissions:
  contents: write

concurrency:
  group: temporary-static-analysis-cleanup-2
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply verified cleanup
        run: python3 .github/static_cleanup.py

      - name: Apply Pint formatting
        run: vendor/bin/pint

      - name: Report remaining PHPStan
        run: composer analyse || true

      - name: Commit cleanup changes
        run: |
          set -euo pipefail
          if git diff --quiet -- app; then
            echo 'No app cleanup changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'refactor: resolve static analysis findings'
          git push origin HEAD:dev
