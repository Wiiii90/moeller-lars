name: Diagnose analytics Pint formatting

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format analytics client and print diff
        run: |
          vendor/bin/pint app/Domain/Analytics/MatomoReportingClient.php
          git diff -- app/Domain/Analytics/MatomoReportingClient.php
          test -z "$(git status --porcelain -- app/Domain/Analytics/MatomoReportingClient.php)"
