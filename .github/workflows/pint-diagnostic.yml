name: Apply analytics Pint formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply formatter and remove diagnostic workflow
        run: |
          vendor/bin/pint app/Domain/Analytics/MatomoReportingClient.php
          rm .github/workflows/pint-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Analytics/MatomoReportingClient.php .github/workflows/pint-diagnostic.yml
          git commit -m 'Apply analytics Pint formatting'
          git push origin HEAD:main
