name: Apply Activity workspace refinement

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/activity-workspace-refinement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Activity workspace refinements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:120]!r}")
              target.write_text(text.replace(old, new, count))

          # Page contract: one shared 25/50/100 page-size setting for both views.
          path = 'app/Filament/Pages/Activity.php'
          replace(path,
          """    protected string $view = 'filament.pages.activity';

    /** @var array<int, array<string, mixed>|null> */
""",
          """    protected string $view = 'filament.pages.activity';

    /** @var list<int> */
    private const PAGE_SIZES = [25, 50, 100];

    private const DEFAULT_PAGE_SIZE = 25;

    /** @var array<int, array<string, mixed>|null> */
""")
          replace(path,
          """        $search = is_string($search) ? trim($search) : '';

        $today = CarbonImmutable::today();
""",
          """        $search = is_string($search) ? trim($search) : '';
        $requestedPerPage = request()->query('per_page');
        $perPage = is_scalar($requestedPerPage) && in_array((int) $requestedPerPage, self::PAGE_SIZES, true)
            ? (int) $requestedPerPage
            : self::DEFAULT_PAGE_SIZE;

        $today = CarbonImmutable::today();
""")
          replace(path,
          """            $feed = $activityFeed->page(
                $area,
                $family,
                actor: $actor,
""",
          """            $feed = $activityFeed->page(
                $area,
                $family,
                perPage: $perPage,
                actor: $actor,
""")
          replace(path,
          """            $history = $historyService->page(
                area: $area,
                family: $family,
                search: $search,
                date: $activeDateValue,
                hour: $activeHour,
            );
""",
          """            $history = $historyService->page(
                area: $area,
                family: $family,
                search: $search,
                date: $activeDateValue,
                hour: $activeHour,
                perPage: $perPage,
            );
""")
          replace(path,
          """            'search' => $search,
            'areaOptions' => AdminActionCatalog::areaOptions(),
""",
          """            'search' => $search,
            'perPage' => $perPage,
            'pageSizes' => self::PAGE_SIZES,
            'areaOptions' => AdminActionCatalog::areaOptions(),
""")

          # Commit history accepts the same upper bound as the shared picker.
          replace(
              'app/Filament/Support/AdminPublicationHistory.php',
              '$perPage = max(10, min(50, $perPage));',
              '$perPage = max(10, min(100, $perPage));',
          )

          # Shared page-size picker: support stable GET URLs in addition to Livewire state.
          path = 'resources/views/components/admin/page-size-picker.blade.php'
          replace(path,
          """    'wireAction' => null,
    'label' => 'Per page',
""",
          """    'wireAction' => null,
    'urls' => [],
    'label' => 'Per page',
""")
          replace(path,
          """            @foreach ($sizeOptions as $sizeOption)
                <button
                    class="admin-pager-size-picker__option {{ $currentValue === $sizeOption ? 'is-active' : '' }}"
                    type="button"
                    role="option"
                    aria-selected="{{ $currentValue === $sizeOption ? 'true' : 'false' }}"
                    @if ($wireAction)
                        wire:click="{{ $wireAction }}({{ $sizeOption }})"
                    @elseif ($wireModel)
                        wire:click="$set('{{ $wireModel }}', {{ $sizeOption }})"
                    @endif
                    x-on:click="open = false"
                >
                    <span class="admin-pager-size-picker__check" aria-hidden="true">{{ $currentValue === $sizeOption ? '✓' : '' }}</span>
                    <span>{{ $sizeOption }}</span>
                </button>
            @endforeach
""",
          """            @foreach ($sizeOptions as $sizeOption)
                @php
                    $optionUrl = is_array($urls) && isset($urls[$sizeOption]) ? (string) $urls[$sizeOption] : null;
                @endphp

                @if (is_string($optionUrl) && $optionUrl !== '')
                    <a
                        class="admin-pager-size-picker__option {{ $currentValue === $sizeOption ? 'is-active' : '' }}"
                        href="{{ $optionUrl }}"
                        role="option"
                        aria-selected="{{ $currentValue === $sizeOption ? 'true' : 'false' }}"
                        x-on:click="open = false"
                    >
                        <span class="admin-pager-size-picker__check" aria-hidden="true">{{ $currentValue === $sizeOption ? '✓' : '' }}</span>
                        <span>{{ $sizeOption }}</span>
                    </a>
                @else
                    <button
                        class="admin-pager-size-picker__option {{ $currentValue === $sizeOption ? 'is-active' : '' }}"
                        type="button"
                        role="option"
                        aria-selected="{{ $currentValue === $sizeOption ? 'true' : 'false' }}"
                        @if ($wireAction)
                            wire:click="{{ $wireAction }}({{ $sizeOption }})"
                        @elseif ($wireModel)
                            wire:click="$set('{{ $wireModel }}', {{ $sizeOption }})"
                        @endif
                        x-on:click="open = false"
                    >
                        <span class="admin-pager-size-picker__check" aria-hidden="true">{{ $currentValue === $sizeOption ? '✓' : '' }}</span>
                        <span>{{ $sizeOption }}</span>
                    </button>
                @endif
            @endforeach
""")

          # Activity/Commits view: canonical GET navigation, shared page size, stable column slots.
          path = 'resources/views/filament/pages/activity.blade.php'
          replace(path,
          """        @php
            $currentQuery = [
""",
          """        @php
            $activityBaseUrl = \\App\\Filament\\Pages\\Activity::getUrl();
            $currentQuery = [
""")
          replace(path,
          """                'hour' => $activeHour,
            ];
            $activityUrl = static function (array $values = []) use ($currentQuery): string {
""",
          """                'hour' => $activeHour,
                'per_page' => $perPage,
            ];
            $activityUrl = static function (array $values = []) use ($currentQuery, $activityBaseUrl): string {
""")
          replace(path,
              "return request()->url().($query === [] ? '' : '?'.http_build_query($query));",
              "return $activityBaseUrl.($query === [] ? '' : '?'.http_build_query($query));",
          )
          replace(path,
          """            foreach (range(0, 23) as $hour) {
                $hourUrls[$hour] = $activityUrl([
                    'calendar_year' => $calendarYear,
                    'calendar_date' => $selectedCalendarDate,
                    'hour' => $hour,
                    'page' => null,
                    'commits_page' => null,
                ]);
            }
            $visiblePublicationGroups = array_slice($publicationContext['staged_groups'], 0, 4);
""",
          """            foreach (range(0, 23) as $hour) {
                $hourUrls[$hour] = $activityUrl([
                    'calendar_year' => $calendarYear,
                    'calendar_date' => $selectedCalendarDate,
                    'hour' => $hour,
                    'page' => null,
                    'commits_page' => null,
                ]);
            }
            $pageSizeUrls = [];
            foreach ($pageSizes as $sizeOption) {
                $pageSizeUrls[$sizeOption] = $activityUrl([
                    'per_page' => $sizeOption,
                    'page' => null,
                    'commits_page' => null,
                ]);
            }
            $visiblePublicationGroups = array_slice($publicationContext['staged_groups'], 0, 4);
""")
          replace(path, '<form method="get" action="{{ request()->url() }}" class="admin-visual-stage-followup">', '<form method="get" action="{{ $activityBaseUrl }}" class="admin-visual-stage-followup">')
          replace(path,
          """                                    href="{{ $activityUrl(['view' => null, 'page' => null, 'commits_page' => null]) }}"
                                    wire:navigate
                                >Activity</a>
""",
          """                                    href="{{ $activityUrl(['view' => null, 'page' => null, 'commits_page' => null]) }}"
                                >Activity</a>
""")
          replace(path,
          """                                    href="{{ $activityUrl(['view' => 'commits', 'page' => null, 'commits_page' => null]) }}"
                                    wire:navigate
                                >Commits</a>
""",
          """                                    href="{{ $activityUrl(['view' => 'commits', 'page' => null, 'commits_page' => null]) }}"
                                >Commits</a>
""")

          replace(path,
          """                    <colgroup>
                        <col class="activity-col--change">
                        <col class="activity-col--target">
                        <col class="activity-col--area">
                        <col class="activity-col--type">
                        <col class="activity-col--publication">
                        <col class="activity-col--who">
                        <col class="activity-col--when">
                        <col class="activity-col--actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Change</th>
                            <th scope="col">Target</th>
                            <th scope="col">Area</th>
                            <th scope="col">Type</th>
                            <th scope="col">Publication</th>
                            <th scope="col">Who</th>
                            <th scope="col">When</th>
                            <th scope="col" class="admin-table__actions">Actions</th>
                        </tr>
                    </thead>
""",
          """                    <colgroup>
                        <col class="activity-col--change">
                        <col class="activity-col--who">
                        <col class="activity-col--when">
                        <col class="activity-col--target">
                        <col class="activity-col--area">
                        <col class="activity-col--type">
                        <col class="activity-col--publication">
                        <col class="activity-col--actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Change</th>
                            <th scope="col">Who</th>
                            <th scope="col">When</th>
                            <th scope="col">Target</th>
                            <th scope="col">Area</th>
                            <th scope="col">Type</th>
                            <th scope="col">Publication</th>
                            <th scope="col" class="admin-table__actions">Actions</th>
                        </tr>
                    </thead>
""")

          activity_who_when = """                                <td class="activity-who-cell" title="{{ $event['actor'] }}">
                                    <strong>{{ $event['actor'] }}</strong>
                                </td>
                                <td class="activity-when-cell">
                                    <time datetime="{{ str_replace(' ', 'T', $event['timestamp']) }}" title="{{ $event['timestamp'] }}">{{ $event['when'] }}</time>
                                    <small>{{ $event['timestamp'] }}</small>
                                </td>
"""
          replace(path, activity_who_when, '')
          activity_change = """                                <td class="activity-change-cell" title="{{ $event['action'] }}">
                                    <strong>{{ $event['action'] }}</strong>
                                </td>
"""
          replace(path, activity_change, activity_change + activity_who_when)

          replace(path,
          """                <footer class="admin-pager" aria-label="Activity pagination">
                    <span class="admin-pager__meta">Page {{ $paginator->currentPage() }} of {{ $paginator->lastPage() }}</span>
                    <span class="admin-pager__range">{{ $paginator->firstItem() ?? 0 }}–{{ $paginator->lastItem() ?? 0 }} of {{ $paginator->total() }}</span>
""",
          """                <footer class="admin-pager" aria-label="Activity pagination">
                    <div class="admin-pager__leading">
                        <span class="admin-pager__meta">Page {{ $paginator->currentPage() }} of {{ $paginator->lastPage() }}</span>
                        <x-admin.page-size-picker :value="$perPage" :options="$pageSizes" :urls="$pageSizeUrls" />
                    </div>
                    <span class="admin-pager__range">{{ $paginator->firstItem() ?? 0 }}–{{ $paginator->lastItem() ?? 0 }} of {{ $paginator->total() }}</span>
""")

          replace(path,
          """                    <colgroup>
                        <col><col><col><col><col><col>
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Commit</th>
                            <th scope="col">Summary</th>
                            <th scope="col">Publication</th>
                            <th scope="col">Who</th>
                            <th scope="col">When</th>
                            <th scope="col" class="admin-table__actions">Actions</th>
                        </tr>
                    </thead>
""",
          """                    <colgroup>
                        <col class="activity-commit-col--commit">
                        <col class="activity-commit-col--who">
                        <col class="activity-commit-col--when">
                        <col class="activity-commit-col--summary">
                        <col class="activity-commit-col--publication">
                        <col class="activity-commit-col--actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Commit</th>
                            <th scope="col">Who</th>
                            <th scope="col">When</th>
                            <th scope="col">Summary</th>
                            <th scope="col">Publication</th>
                            <th scope="col" class="admin-table__actions">Actions</th>
                        </tr>
                    </thead>
""")
          commit_who_when = """                                <td class="activity-who-cell">
                                    <strong>{{ $commit['actor'] }}</strong>
                                </td>
                                <td class="activity-when-cell">
                                    <time datetime="{{ str_replace(' ', 'T', $commit['timestamp']) }}" title="{{ $commit['timestamp'] }}">{{ $commit['when'] }}</time>
                                    <small>{{ $commit['timestamp'] }}</small>
                                </td>
"""
          replace(path, commit_who_when, '')
          commit_cell = """                                <td class="activity-commit-cell">
                                    <div class="activity-commit-cell__heading">
                                        <code>{{ $commit['short_hash'] }}</code>
                                        @if ($commit['live'])
                                            <span class="admin-status is-published">LIVE</span>
                                        @endif
                                    </div>
                                </td>
"""
          replace(path, commit_cell, commit_cell + commit_who_when)
          replace(path,
          """                <footer class="admin-pager" aria-label="Commit pagination">
                    <span class="admin-pager__meta">Page {{ $commitPaginator->currentPage() }} of {{ $commitPaginator->lastPage() }}</span>
                    <span class="admin-pager__range">{{ $commitPaginator->firstItem() ?? 0 }}–{{ $commitPaginator->lastItem() ?? 0 }} of {{ $commitPaginator->total() }}</span>
""",
          """                <footer class="admin-pager" aria-label="Commit pagination">
                    <div class="admin-pager__leading">
                        <span class="admin-pager__meta">Page {{ $commitPaginator->currentPage() }} of {{ $commitPaginator->lastPage() }}</span>
                        <x-admin.page-size-picker :value="$perPage" :options="$pageSizes" :urls="$pageSizeUrls" />
                    </div>
                    <span class="admin-pager__range">{{ $commitPaginator->firstItem() ?? 0 }}–{{ $commitPaginator->lastItem() ?? 0 }} of {{ $commitPaginator->total() }}</span>
""")

          # Geometry: give Date one subtrack from Change type and align shared table slots.
          path = 'resources/css/admin/activity.css'
          replace(path,
          """.activity-workspace__controls > .activity-control--type { grid-column: span 3; }
.activity-workspace__controls > .activity-control--date { grid-column: span 2; }
""",
          """.activity-workspace__controls > .activity-control--type { grid-column: span 2; }
.activity-workspace__controls > .activity-control--date { grid-column: span 3; }
""")
          replace(path,
          """.activity-events-table .activity-col--change,
.activity-events-table .activity-col--target,
.activity-events-table .activity-col--publication,
.activity-events-table .activity-col--actions {
    width: 16.6667%;
}

.activity-events-table .activity-col--area,
.activity-events-table .activity-col--type,
.activity-events-table .activity-col--who,
.activity-events-table .activity-col--when {
    width: 8.3333%;
}
""",
          """.activity-events-table .activity-col--change,
.activity-events-table .activity-col--publication,
.activity-events-table .activity-col--actions {
    width: 16.6667%;
}

.activity-events-table .activity-col--who {
    width: 7.5%;
}

.activity-events-table .activity-col--when {
    width: 9.1667%;
}

.activity-events-table .activity-col--target {
    width: 15%;
}

.activity-events-table .activity-col--area {
    width: 8%;
}

.activity-events-table .activity-col--type {
    width: 10.3332%;
}
""")
          replace(path,
          """.activity-actions-cell .admin-toolbar {
    gap: .2rem;
    justify-content: flex-start;
    flex-wrap: nowrap;
}
""",
          """.activity-actions-cell .admin-toolbar {
    gap: .2rem;
    justify-content: flex-start;
    flex-wrap: nowrap;
}

.activity-actions-cell .admin-action {
    column-gap: .28rem;
}
""")
          replace(path,
          """.activity-commits-table col {
    width: 16.6667%;
}
""",
          """.activity-commits-table .activity-commit-col--commit,
.activity-commits-table .activity-commit-col--publication,
.activity-commits-table .activity-commit-col--actions {
    width: 16.6667%;
}

.activity-commits-table .activity-commit-col--who {
    width: 7.5%;
}

.activity-commits-table .activity-commit-col--when {
    width: 9.1667%;
}

.activity-commits-table .activity-commit-col--summary {
    width: 33.3332%;
}
""")

          # Shared pager supports a left cluster containing page metadata + picker.
          path = 'resources/css/admin/data-workspace.css'
          replace(path,
          """.admin-pager__meta {
    justify-self: start;
    color: var(--admin-muted);
    font-size: var(--admin-font-size-table-support);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
""",
          """.admin-pager__leading {
    display: inline-flex;
    min-width: 0;
    gap: .8rem;
    align-items: center;
    justify-self: start;
}

.admin-pager__meta {
    justify-self: start;
    color: var(--admin-muted);
    font-size: var(--admin-font-size-table-support);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
""")
          replace(path,
          """    text-align: center;
    cursor: pointer;
}

.admin-pager-size-picker__option:hover,
""",
          """    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.admin-pager-size-picker__option:hover,
""")

          # Guard the page-size bounds in the existing filter contract suite.
          path = 'tests/Feature/ActivityFilterContractTest.php'
          text = Path(path).read_text()
          addition = r'''

it('uses the shared Activity page-size contract for activity and commit history', function (): void {
    $actor = User::factory()->admin()->create();

    $activity = app(AdminActivityFeed::class)->page(perPage: 25, actor: $actor);
    $history = app(AdminPublicationHistory::class)->page(perPage: 100);
    $clampedHistory = app(AdminPublicationHistory::class)->page(perPage: 500);

    expect($activity['paginator']->perPage())->toBe(25)
        ->and($history['paginator']->perPage())->toBe(100)
        ->and($clampedHistory['paginator']->perPage())->toBe(100);
});
'''
          if "uses the shared Activity page-size contract" not in text:
              Path(path).write_text(text.rstrip() + addition + "\n")

          # Never leave the one-shot workflow in the repository.
          Path('.github/workflows/activity-workspace-refinement.yml').unlink()
          PY

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: refine Activity workspace navigation and paging"
          git push origin HEAD:dev
