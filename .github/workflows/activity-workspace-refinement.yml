name: Apply Activity workspace refinement

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/activity-workspace-refinement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply refinement
        run: python3 scripts/activity_workspace_refinement.py

      - name: Remove one-shot helpers
        run: rm scripts/activity_workspace_refinement.py .github/workflows/activity-workspace-refinement.yml

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: refine Activity workspace navigation and paging"
          git push origin HEAD:dev
