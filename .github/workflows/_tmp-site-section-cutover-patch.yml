name: Temporary SiteSection cutover patch

on:
  push:
    branches:
      - work/site-section-cutover-one-shot-20260820

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cutover source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Gallery content creation no longer writes obsolete placement columns.
          replace(
              'app/Domain/Artwork/ArtworkCategoryEditorialService.php',
              """            $category = new ArtworkCategory;\n            $category->fill([\n                ...$validated,\n                // Transitional columns remain inert until the post-acceptance schema cleanup.\n                'state' => 'hidden',\n                'position' => 0,\n                'show_in_navigation' => false,\n                'parent_id' => null,\n                'legacy_id' => null,\n                'legacy_source' => null,\n                'migration_batch_id' => null,\n                'migrated_at' => null,\n            ]);\n            $category->save();\n""",
              """            $category = new ArtworkCategory;\n            $category->fill($validated);\n            $category->save();\n""",
          )

          # Legacy artwork import creates canonical Gallery sections explicitly.
          replace(
              'app/Domain/Migration/LegacyArtworkManifestImporter.php',
              "use App\\Models\\ArtworkMedia;\n",
              "use App\\Models\\ArtworkMedia;\nuse App\\Models\\SiteSection;\n",
          )
          replace(
              'app/Domain/Migration/LegacyArtworkManifestImporter.php',
              """                        'name' => $categoryData['name'],\n                        'state' => 'published',\n                        'position' => $categoryData['position'],\n                        'show_in_navigation' => $categoryData['show_in_navigation'],\n                        'show_on_home' => $categoryData['show_on_home'],\n""",
              """                        'name' => $categoryData['name'],\n                        'show_on_home' => $categoryData['show_on_home'],\n""",
          )
          replace(
              'app/Domain/Migration/LegacyArtworkManifestImporter.php',
              """                    $category->save();\n\n                    foreach ($categoryData['artworks'] as $artworkData) {\n""",
              """                    $category->save();\n\n                    SiteSection::query()->create([\n                        'type' => SiteSection::TYPE_GALLERY,\n                        'title' => $categoryData['name'],\n                        'navigation_label' => $categoryData['name'],\n                        'slug' => $categoryData['slug'],\n                        'state' => 'published',\n                        'position' => $categoryData['position'],\n                        'show_in_navigation' => $categoryData['show_in_navigation'],\n                        'parent_id' => null,\n                        'artwork_category_id' => (int) $category->getKey(),\n                    ]);\n\n                    foreach ($categoryData['artworks'] as $artworkData) {\n""",
          )

          # Legacy CV/Exhibitions import checks and updates the canonical singleton sections.
          replace(
              'app/Domain/Migration/LegacyPublicCvImporter.php',
              "use Illuminate\\Support\\Facades\\DB;\n",
              "use App\\Models\\SiteSection;\nuse Illuminate\\Support\\Facades\\DB;\n",
          )
          replace(
              'app/Domain/Migration/LegacyPublicCvImporter.php',
              """                if (DB::table('artwork_categories')\n                    ->where('state', 'published')\n                    ->where('show_in_navigation', true)\n                    ->where('position', $position)\n                    ->exists()) {\n""",
              """                if (DB::table('site_sections')\n                    ->whereNull('parent_id')\n                    ->where('state', 'published')\n                    ->where('show_in_navigation', true)\n                    ->where('position', $position)\n                    ->exists()) {\n""",
          )
          replace(
              'app/Domain/Migration/LegacyPublicCvImporter.php',
              """            DB::table('public_content_settings')\n                ->where('id', 1)\n                ->update([\n                    'cv_enabled' => true,\n                    'exhibitions_enabled' => true,\n                    'cv_navigation_label' => 'CV',\n                    'cv_navigation_position' => 3,\n                    'exhibitions_navigation_label' => 'EXHIBITIONS',\n                    'exhibitions_navigation_position' => 4,\n                    'updated_at' => $now,\n                ]);\n\n            return count($rows);\n""",
              """            DB::table('public_content_settings')\n                ->where('id', 1)\n                ->update([\n                    'cv_enabled' => true,\n                    'exhibitions_enabled' => true,\n                    'cv_navigation_label' => 'CV',\n                    'cv_navigation_position' => 3,\n                    'exhibitions_navigation_label' => 'EXHIBITIONS',\n                    'exhibitions_navigation_position' => 4,\n                    'updated_at' => $now,\n                ]);\n\n            $vitaUpdated = DB::table('site_sections')\n                ->where('type', SiteSection::TYPE_VITA)\n                ->update([\n                    'navigation_label' => 'CV',\n                    'state' => 'published',\n                    'position' => 3,\n                    'show_in_navigation' => true,\n                    'updated_at' => $now,\n                ]);\n            $exhibitionsUpdated = DB::table('site_sections')\n                ->where('type', SiteSection::TYPE_EXHIBITIONS)\n                ->update([\n                    'navigation_label' => 'EXHIBITIONS',\n                    'state' => 'published',\n                    'position' => 4,\n                    'show_in_navigation' => true,\n                    'updated_at' => $now,\n                ]);\n            if ($vitaUpdated !== 1 || $exhibitionsUpdated !== 1) {\n                throw new RuntimeException('Canonical Vita or Exhibitions site section is missing.');\n            }\n\n            return count($rows);\n""",
          )
          PY

          rm .github/workflows/_tmp-site-section-cutover-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete canonical SiteSection source cutover"
          git push origin HEAD:work/site-section-cutover-one-shot-20260820
