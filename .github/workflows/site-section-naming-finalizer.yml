name: Finalize site section naming

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: finalize-site-section-naming
  cancel-in-progress: false

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: run site section naming finalizer' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact dev head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical naming refactor
        shell: bash
        run: |
          set -euo pipefail

          test -f app/Domain/Content/SiteNodeType.php
          test ! -e app/Domain/Content/SiteSectionType.php
          test -f app/Domain/Blog/BlogEditorialService.php
          test ! -e app/Domain/Content/BlogEditorialService.php

          git mv app/Domain/Content/SiteNodeType.php app/Domain/Content/SiteSectionType.php
          git mv app/Domain/Blog/BlogEditorialService.php app/Domain/Content/BlogEditorialService.php

          mapfile -d '' files < <(git grep -Il -z \
            -e 'SiteNodeType' \
            -e 'App\\Domain\\Blog\\BlogEditorialService' \
            -- . ':!.github/workflows/site-section-naming-finalizer.yml' || true)

          if ((${#files[@]})); then
            perl -pi -e 's/SiteNodeType/SiteSectionType/g; s/App\\Domain\\Blog\\BlogEditorialService/App\\Domain\\Content\\BlogEditorialService/g' "${files[@]}"
          fi

          perl -pi -e 's/^namespace App\\Domain\\Blog;$/namespace App\\Domain\\Content;/' app/Domain/Content/BlogEditorialService.php
          perl -ni -e 'print unless /^use App\\Domain\\Content\\(?:JournalEntryMediaService|JournalEntryOrderService|JournalTemplate|SafeRichTextRenderer|SiteSectionType);$/' app/Domain/Content/BlogEditorialService.php

          test -f app/Domain/Content/SiteSectionType.php
          test ! -e app/Domain/Content/SiteNodeType.php
          test -f app/Domain/Content/BlogEditorialService.php
          test ! -e app/Domain/Blog/BlogEditorialService.php
          grep -Fxq 'namespace App\Domain\Content;' app/Domain/Content/BlogEditorialService.php
          grep -Fxq 'enum SiteSectionType: string' app/Domain/Content/SiteSectionType.php

          if git grep -n \
            -e 'SiteNodeType' \
            -e 'App\\Domain\\Blog\\BlogEditorialService' \
            -- . ':!.github/workflows/site-section-naming-finalizer.yml'; then
            echo 'Obsolete naming remains after refactor.' >&2
            exit 1
          fi

          git diff --check

      - name: Commit refactor to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: align site section naming'
          git push origin HEAD:dev
