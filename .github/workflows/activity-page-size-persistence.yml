name: Persist Activity page size

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/activity-page-size-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Persist page size in filter submissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/filament/pages/activity.blade.php')
          text = path.read_text()
          old = '                <input type="hidden" name="calendar_year" value="{{ $calendarYear }}">\n'
          new = old + '                <input type="hidden" name="per_page" value="{{ $perPage }}">\n'
          if old not in text:
              raise SystemExit('calendar_year hidden field not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/activity-page-size-persistence.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve Activity page size across filters"
          git push origin HEAD:dev
