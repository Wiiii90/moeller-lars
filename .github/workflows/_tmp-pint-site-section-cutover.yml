name: Temporary Pint SiteSection cutover

on:
  push:
    branches:
      - tmp/pint-site-section-cutover-20260820

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Pint exactly
        run: vendor/bin/pint

      - name: Commit formatter output only
        shell: bash
        run: |
          rm .github/workflows/_tmp-pint-site-section-cutover.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Pint produced no changes.'
            exit 0
          fi
          git commit -m 'Format SiteSection cutover with Pint'
          git push origin HEAD:tmp/pint-site-section-cutover-20260820
