name: Temporary Pint fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/pint-fix-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: Apply Pint to reported files
        run: |
          vendor/bin/pint \
            app/Domain/Admin/AdminUndoService.php \
            app/Domain/Content/CustomPageEditorialService.php \
            app/Models/CustomPageSetting.php

      - name: Commit exact formatter result
        run: |
          if git diff --quiet -- \
            app/Domain/Admin/AdminUndoService.php \
            app/Domain/Content/CustomPageEditorialService.php \
            app/Models/CustomPageSetting.php; then
            echo "Pint produced no diff."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Domain/Admin/AdminUndoService.php \
            app/Domain/Content/CustomPageEditorialService.php \
            app/Models/CustomPageSetting.php
          git commit -m "style: apply Pint formatting"
          git push origin HEAD:dev
