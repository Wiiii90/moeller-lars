name: Finalize admin dialog retirement

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dialog-finalize-direct.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Finalize dialog migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin dev

          if ! python3 scripts/admin_dialog_finalize.py > /tmp/dialog-finalize.log 2>&1; then
            git reset --hard HEAD
            git clean -fd
            cp /tmp/dialog-finalize.log scripts/dialog-finalize-error.txt
            git add scripts/dialog-finalize-error.txt
            git commit -m 'chore: record dialog finalizer stop reason'
            git push origin HEAD:dev
            exit 1
          fi

          rm .github/workflows/dialog-finalize-direct.yml scripts/admin_dialog_finalize.py
          git diff --check
          git add -A
          git commit -m 'refactor: finalize canonical admin dialogs'
          git pull --rebase origin dev
          git push origin HEAD:dev
