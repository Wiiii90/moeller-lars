name: Generate Larastan lock

on:
  push:
    branches: [fix/post-dialog-merge-gate]
    paths:
      - .github/workflows/generate-larastan-lock.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Update locked static-analysis dependencies
        run: composer require --dev "larastan/larastan:^3.0" --no-interaction --no-progress

      - name: Configure Laravel-aware PHPStan
        run: |
          cat > phpstan.neon <<'EOF'
          includes:
              - vendor/larastan/larastan/extension.neon
              - vendor/nesbot/carbon/extension.neon

          parameters:
              level: 5
              paths:
                  - app
              tmpDir: storage/framework/phpstan
          EOF

      - name: Commit generated Composer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock phpstan.neon
          git diff --cached --quiet && exit 0
          git commit -m "build: add Laravel-aware PHPStan analysis"
          git push origin "HEAD:${GITHUB_REF_NAME}"
