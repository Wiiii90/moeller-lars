name: Final Activity commit identity fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/final-activity-commit-identity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moeller_lars_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moeller_lars_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: moeller_lars_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MOELLER_LARS_DISPOSABLE_TEST_DATABASE: '1'
      MATOMO_TRACKING_ENABLED: false
      MATOMO_REPORTING_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply exact commit identity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feed = Path('app/Filament/Support/AdminActivityFeed.php')
          text = feed.read_text()
          old = "                'checkpoint_id' => $checkpoint?->getKey(),\n                'checkpoint_message' => $checkpoint?->getAttribute('message'),"
          new = "                'checkpoint_id' => $checkpoint?->getKey(),\n                'checkpoint_short_hash' => $checkpoint instanceof PublicationCheckpoint ? $checkpoint->shortHash() : null,\n                'checkpoint_message' => $checkpoint?->getAttribute('message'),"
          assert text.count(old) == 1
          feed.write_text(text.replace(old, new))

          blade = Path('resources/views/filament/pages/activity.blade.php')
          text = blade.read_text()
          old = "<small>Commit #{{ $event['checkpoint_id'] }} · {{ $event['checkpoint_at'] }}</small>"
          new = "<small>Commit {{ $event['checkpoint_short_hash'] ?? '#'.$event['checkpoint_id'] }} · {{ $event['checkpoint_at'] }}</small>"
          assert text.count(old) == 1
          blade.write_text(text.replace(old, new))

          test = Path('tests/Feature/ActivityPublicationControlTest.php')
          text = test.read_text()
          old = "use App\\Models\\PublicationCheckpoint;\nuse App\\Models\\User;"
          new = "use App\\Models\\PublicationCheckpoint;\nuse App\\Models\\PublicationCheckpointEvent;\nuse App\\Models\\User;"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "    $projected = app(AdminActivityFeed::class)->event((int) $event->getKey(), $actor);"
          new = "    PublicationCheckpointEvent::query()->create([\n        'publication_checkpoint_id' => $checkpoint->getKey(),\n        'audit_event_id' => $event->getKey(),\n        'created_at' => now(),\n    ]);\n\n    $projected = app(AdminActivityFeed::class)->event((int) $event->getKey(), $actor);"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "        ->and($projected['target'])->toBe('Commit '.$checkpoint->shortHash())\n        ->and($projected['url'])->toContain('?view=commits');"
          new = "        ->and($projected['target'])->toBe('Commit '.$checkpoint->shortHash())\n        ->and($projected['checkpoint_short_hash'])->toBe($checkpoint->shortHash())\n        ->and($projected['publication_status'])->toBe('committed')\n        ->and($projected['url'])->toContain('?view=commits');"
          assert text.count(old) == 1
          test.write_text(text.replace(old, new))
          PY

      - name: Format changed PHP
        run: vendor/bin/pint app/Filament/Support/AdminActivityFeed.php tests/Feature/ActivityPublicationControlTest.php

      - name: Run focused test
        run: php artisan test tests/Feature/ActivityPublicationControlTest.php

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-activity-commit-identity-fix.yml
          git add app/Filament/Support/AdminActivityFeed.php resources/views/filament/pages/activity.blade.php tests/Feature/ActivityPublicationControlTest.php
          git commit -m "fix: show publication commit hashes in Activity"
          git push origin HEAD:dev
