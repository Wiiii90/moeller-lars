name: Complete admin dialog migration

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dialog-migration-direct.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moeller_lars_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moeller_lars_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: moeller_lars_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MOELLER_LARS_DISPOSABLE_TEST_DATABASE: '1'
      MATOMO_TRACKING_ENABLED: false
      MATOMO_REPORTING_ENABLED: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply dialog migration
        run: |
          set -euo pipefail
          git pull --ff-only origin dev
          python3 scripts/admin_dialog_migration.py
          rm scripts/admin_dialog_migration.py
          rm .github/workflows/dialog-migration-direct.yml
          git diff --check
          find app -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Run Pest
        run: composer test

      - name: Run PHPStan
        continue-on-error: true
        run: composer analyse

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Commit directly to dev
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete admin dialog migration'
          before_rebase=$(git rev-parse HEAD)
          git pull --rebase origin dev
          if [ "$(git rev-parse HEAD)" != "$before_rebase" ]; then
            git diff --check HEAD~1
            find app -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
            composer test
            vendor/bin/pint --test
            npm run test:js
            npm run build
          fi
          git push origin HEAD:dev
