name: Direct admin dialog migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dialog-migration-direct.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Migrate edit dialogs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin dev
          python3 scripts/dialog_migration.py

          if rg -n 'AdminDialog::editCommit|function editCommit' app docs; then
            echo 'editCommit bridge still exists' >&2
            exit 1
          fi

          rm .github/workflows/dialog-migration-direct.yml scripts/dialog_migration.py
          git diff --check
          git add -A
          git commit -m 'refactor: complete edit dialog autosave migration'
          git pull --rebase origin dev
          git push origin HEAD:dev
