name: Direct admin dialog migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dialog-migration-direct.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moeller_lars_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moeller_lars_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Rebase onto current dev
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin dev

      - name: Migrate edit dialogs to canonical autosave
        run: |
          set -euo pipefail

          cat > app/Filament/Support/Dialogs/InteractsWithAdminEditDialogAutosave.php <<'PHP'
          <?php

          namespace App\Filament\Support\Dialogs;

          use Filament\Actions\Action;
          use Filament\Support\Exceptions\Cancel;
          use Filament\Support\Exceptions\Halt;
          use Illuminate\Validation\ValidationException;
          use Throwable;

          trait InteractsWithAdminEditDialogAutosave
          {
              /** @var array<string, string> */
              public array $adminEditDialogPersistedFingerprints = [];

              public function persistMountedAdminEdit(): void
              {
                  $action = $this->getMountedAction();

                  if (! $action instanceof Action) {
                      return;
                  }

                  $schema = $this->getMountedActionSchema(mountedAction: $action);

                  if ($schema === null) {
                      return;
                  }

                  $action->beginDatabaseTransaction();

                  try {
                      $action->callBeforeFormValidated();
                      $state = $schema->getState();
                      $action->callAfterFormValidated();
                      $action->data($state);

                      $key = $action->getName().':'.hash('sha256', serialize($action->getArguments()));
                      $fingerprint = hash('sha256', serialize($state));

                      if (($this->adminEditDialogPersistedFingerprints[$key] ?? null) === $fingerprint) {
                          $action->commitDatabaseTransaction();

                          return;
                      }

                      $action->callBefore();
                      $action->call([
                          'form' => $schema,
                          'schema' => $schema,
                      ]);
                      $action->callAfter();
                      $this->afterActionCalled($action);
                      $action->commitDatabaseTransaction();

                      $this->adminEditDialogPersistedFingerprints[$key] = $fingerprint;
                  } catch (Halt $exception) {
                      $exception->shouldRollbackDatabaseTransaction()
                          ? $action->rollBackDatabaseTransaction()
                          : $action->commitDatabaseTransaction();
                  } catch (Cancel $exception) {
                      $exception->shouldRollbackDatabaseTransaction()
                          ? $action->rollBackDatabaseTransaction()
                          : $action->commitDatabaseTransaction();
                  } catch (ValidationException $exception) {
                      $action->rollBackDatabaseTransaction();

                      throw $exception;
                  } catch (Throwable $exception) {
                      $action->rollBackDatabaseTransaction();

                      throw $exception;
                  }
              }
          }
          PHP

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          php_files = list((root / 'app' / 'Filament').rglob('*.php'))
          changed = []
          migrated_call = re.compile(
              r"(AdminDialog::edit\([\s\S]*?),\s*(?:'(?:\\.|[^'])*'|\"(?:\\.|[^\"])*\")\s*,\s*(AdminDialogSize::[A-Za-z]+)\s*\)",
              re.M,
          )
          migrated_default = re.compile(
              r"(AdminDialog::edit\([\s\S]*?),\s*(?:'(?:\\.|[^'])*'|\"(?:\\.|[^\"])*\")\s*\)",
              re.M,
          )

          for path in php_files:
              text = path.read_text()
              if 'AdminDialog::editCommit' not in text:
                  continue

              expected = text.count('AdminDialog::editCommit')
              migrated = text.replace('AdminDialog::editCommit(', 'AdminDialog::edit(')
              migrated, sized = migrated_call.subn(r'\1, \2)', migrated)
              migrated, defaulted = migrated_default.subn(r'\1)', migrated)
              converted = sized + defaulted
              if converted != expected:
                  raise SystemExit(f'Expected {expected} converted edit calls in {path}, got {converted}')

              import_line = 'use App\\Filament\\Support\\Dialogs\\InteractsWithAdminEditDialogAutosave;\n'
              if import_line not in migrated:
                  marker = 'use App\\Filament\\Support\\Dialogs\\AdminDialog;\n'
                  if marker not in migrated:
                      raise SystemExit(f'Missing AdminDialog import in {path}')
                  migrated = migrated.replace(marker, marker + import_line, 1)

              if 'use InteractsWithAdminEditDialogAutosave;' not in migrated:
                  declaration = re.search(r'(?m)^(?:final\s+|abstract\s+)?(?:class|trait)\s+[A-Za-z0-9_]+[^\n]*\n\{\n', migrated)
                  if declaration is None:
                      raise SystemExit(f'Could not find class/trait declaration in {path}')
                  insert_at = declaration.end()
                  migrated = migrated[:insert_at] + '    use InteractsWithAdminEditDialogAutosave;\n\n' + migrated[insert_at:]

              path.write_text(migrated)
              changed.append((str(path), converted))

          if not changed:
              raise SystemExit('Expected editCommit flows, found none')

          helper = root / 'app/Filament/Support/Dialogs/AdminDialog.php'
          text = helper.read_text()
          bridge_pattern = re.compile(
              r"\n    /\*\*\n     \* Transitional helper for an edit that still has atomic persistence\.[\s\S]*?\n    public static function editCommit\([\s\S]*?\n    \}\n",
              re.M,
          )
          text, count = bridge_pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('Could not remove AdminDialog::editCommit bridge')

          old = "        if ($type === AdminDialogType::Confirm) {\n            $classes[] = 'admin-dialog--confirmation';\n        }\n\n        return $action\n            // Filament still owns modal state, focus, Escape and the native X.\n            // The shared CSS width modifier is the actual visual authority.\n            ->modalWidth(Width::Large)\n            ->extraModalWindowAttributes(['class' => implode(' ', $classes)]);"
          new = "        if ($type === AdminDialogType::Confirm) {\n            $classes[] = 'admin-dialog--confirmation';\n        }\n\n        $attributes = ['class' => implode(' ', $classes)];\n\n        if ($type === AdminDialogType::Edit) {\n            // Native change events give text/textarea blur commits and immediate\n            // select/toggle commits without timer-driven persistence.\n            $attributes['wire:change'] = 'persistMountedAdminEdit';\n        }\n\n        return $action\n            // Filament still owns modal state, focus, Escape and the native X.\n            // The shared CSS width modifier is the actual visual authority.\n            ->modalWidth(Width::Large)\n            ->extraModalWindowAttributes($attributes);"
          if old not in text:
              raise SystemExit('AdminDialog base block changed unexpectedly')
          helper.write_text(text.replace(old, new, 1))

          doc = root / 'docs/ADMIN-DIALOG-CONTRACT.md'
          text = doc.read_text()
          paragraph = "\nThe framework helper `AdminDialog::editCommit()` exists only as a migration bridge for existing atomic edit workflows whose domain semantics cannot safely be converted in the same source pass. It must not be used for new dialogs and must be removed from each flow once that flow has canonical autosave/receipt coverage.\n"
          if paragraph not in text:
              raise SystemExit('Dialog migration-bridge paragraph changed unexpectedly')
          doc.write_text(text.replace(paragraph, '\n'))

          print('Migrated edit dialog files:')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY

          if rg -n 'AdminDialog::editCommit|function editCommit' app docs; then
            echo 'editCommit bridge still exists' >&2
            exit 1
          fi

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format and verify changed PHP
        run: |
          set -euo pipefail
          changed_php="$(git diff --name-only -- 'app/Filament/**/*.php')"
          vendor/bin/pint app/Filament/Support/Dialogs/AdminDialog.php app/Filament/Support/Dialogs/InteractsWithAdminEditDialogAutosave.php $changed_php
          git diff --check
          while IFS= read -r file; do
            [[ -z "$file" ]] || php -l "$file" >/dev/null
          done <<< "$changed_php"

      - name: Run focused dialog and admin tests
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: moeller_lars_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          MOELLER_LARS_DISPOSABLE_TEST_DATABASE: '1'
          MATOMO_TRACKING_ENABLED: false
          MATOMO_REPORTING_ENABLED: false
        run: |
          set -euo pipefail
          export APP_KEY="$(php artisan key:generate --show)"
          composer test -- --filter='Dialog|HomePresentation|Dashboard|General|Journal|Gallery|CustomPage|SitePages|MediaAsset'

      - name: Commit migration and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/dialog-migration-direct.yml
          git add -A
          git diff --cached --check
          git commit -m 'refactor: complete edit dialog autosave migration'
          git pull --rebase origin dev
          git push origin HEAD:dev
