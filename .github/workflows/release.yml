name: Verify and build release image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moeller_lars_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moeller_lars_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: moeller_lars_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MATOMO_TRACKING_ENABLED: false
      MATOMO_REPORTING_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Run Pest
        run: composer test

      - name: Run PHPStan
        run: composer analyse

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run JavaScript tests
        run: npm run test:js

  release-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wiiii90/moeller-lars:${{ github.sha }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release identity
        run: |
          echo "### moeller-lars release image" >> "$GITHUB_STEP_SUMMARY"
          echo "Git SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/wiiii90/moeller-lars@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  publish-release-status:
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, release-image]
    steps:
      - name: Publish release/image commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          IMAGE_RESULT: ${{ needs.release-image.result }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_RESULT" == success && "$IMAGE_RESULT" == success ]]; then
            state=success
            description='Verification passed and immutable GHCR image published'
          else
            state=failure
            description="verify=${VERIFY_RESULT}, image=${IMAGE_RESULT}"
          fi

          jq -n \
            --arg state "$state" \
            --arg context 'release/image' \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:$context, description:$description,target_url:$target_url}' \
            | curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --data-binary @- \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
