name: Verify and build release image

on:
  push:
    branches: [main, agent/admin-validation-rc]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moeller_lars_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moeller_lars_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: moeller_lars_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MATOMO_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Generate test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Run Pest
        run: |
          set -o pipefail
          composer test 2>&1 | tee pest.log

      - name: Upload Pest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-rc-pest-failure
          path: pest.log
          retention-days: 1

      - name: Run PHPStan
        run: |
          set -o pipefail
          composer analyse 2>&1 | tee phpstan.log

      - name: Upload PHPStan failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-rc-phpstan-failure
          path: phpstan.log
          retention-days: 1

      - name: Apply canonical PHP formatting to admin RC
        run: |
          vendor/bin/pint
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Apply Pint formatting to admin RC'
          git push
          exit 1

      - name: Run JavaScript tests
        run: npm run test:js

  release-image:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wiiii90/moeller-lars:${{ github.sha }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release identity
        run: |
          echo "### moeller-lars release image" >> "$GITHUB_STEP_SUMMARY"
          echo "Git SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/wiiii90/moeller-lars@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  report-validation-rc:
    if: always() && github.ref == 'refs/heads/agent/admin-validation-rc'
    runs-on: ubuntu-latest
    needs: [verify, release-image]
    steps:
      - uses: actions/checkout@v4

      - name: Record validation pipeline result
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          IMAGE_RESULT: ${{ needs.release-image.result }}
          RELEASE_DIGEST: ${{ needs.release-image.outputs.digest }}
        run: |
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'run_id=%s\n' "$RUN_ID"
            printf 'verify=%s\n' "$VERIFY_RESULT"
            printf 'release_image=%s\n' "$IMAGE_RESULT"
            if [ -n "$RELEASE_DIGEST" ]; then
              printf 'image=ghcr.io/wiiii90/moeller-lars@%s\n' "$RELEASE_DIGEST"
            fi
          } > .validation-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .validation-release
          git commit -m 'Record admin validation pipeline result [skip ci]'
          git push
