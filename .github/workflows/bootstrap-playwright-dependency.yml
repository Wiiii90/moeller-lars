name: Bootstrap Playwright dependency

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/bootstrap-playwright-dependency.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-playwright-dependency
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Add Playwright test development dependency
        run: npm install --save-dev --ignore-scripts '@playwright/test@1.63.0'

      - name: Commit npm files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: add Playwright test dependency'
          git pull --rebase origin dev
          git push origin HEAD:dev
