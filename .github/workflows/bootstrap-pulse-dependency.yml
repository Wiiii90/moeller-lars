name: Bootstrap Pulse dependency

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/bootstrap-pulse-dependency.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-pulse-dependency
  cancel-in-progress: false

jobs:
  install-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_pgsql, zip
          coverage: none

      - name: Install Pulse and publish application files
        run: |
          composer require 'laravel/pulse:^1.8' --no-interaction --no-progress
          php artisan vendor:publish --provider='Laravel\Pulse\PulseServiceProvider' --force

      - name: Commit Composer and Pulse files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock config/pulse.php database/migrations
          git commit -m 'chore: add Laravel Pulse runtime dependency'
          git pull --rebase origin dev
          git push origin HEAD:dev
