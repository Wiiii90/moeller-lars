name: Temporary final SiteSection test fix

on:
  push:
    branches:
      - tmp/site-section-final-test-fix-20260820

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh inert legacy baselines before assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          for path, old, new in [
              (
                  'tests/Feature/ArtworkCategoryHierarchyTest.php',
                  "$legacyState = $category->getRawOriginal('state');",
                  "$legacyState = $category->fresh()->getRawOriginal('state');",
              ),
              (
                  'tests/Feature/SitePagesWorkspaceTest.php',
                  "$legacyGalleryState = $gallery->getRawOriginal('state');",
                  "$legacyGalleryState = $gallery->fresh()->getRawOriginal('state');",
              ),
              (
                  'tests/Feature/SitePagesWorkspaceTest.php',
                  "$legacyParentState = $parent->getRawOriginal('state');",
                  "$legacyParentState = $parent->fresh()->getRawOriginal('state');",
              ),
          ]:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old}')
              p.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/_tmp-site-section-final-test-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix canonical cutover test baselines"
          git push origin HEAD:tmp/site-section-final-test-fix-20260820
