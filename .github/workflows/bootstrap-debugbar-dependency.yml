name: Bootstrap Debugbar dependency

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/bootstrap-debugbar-dependency.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-debugbar-dependency
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Add Laravel Debugbar development dependency
        run: composer require 'fruitcake/laravel-debugbar:^4.4' --dev --no-interaction --no-progress --no-scripts

      - name: Commit Composer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'chore: add Laravel Debugbar development dependency'
          git pull --rebase origin dev
          git push origin HEAD:dev
