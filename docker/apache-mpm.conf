<IfModule mpm_prefork_module>
    # Caddy owns client-facing persistent HTTP/2 connections. Keeping the
    # internal Caddy -> Apache HTTP/1.1 hop persistent can pin this small
    # mod_php prefork pool and queue otherwise trivial parallel requests.
    KeepAlive               Off

    StartServers             1
    MinSpareServers          1
    MaxSpareServers          4
    ServerLimit              4
    MaxRequestWorkers        4
    MaxConnectionsPerChild   500
</IfModule>
