memory_limit = 128M
; Transport ceilings exceed the 150 MiB canonical default to allow multipart overhead.
; Per-media limits and admission quotas are still enforced in MediaIngestService.
upload_max_filesize = 160M
post_max_size = 176M

; Application code is immutable inside a release container. Avoid a filesystem
; timestamp check for every PHP script on every request; deployment restarts the
; container whenever code changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.save_comments = 1
