memory_limit = 128M
; The bounded image/video derivative subprocesses can take longer than the
; default web-request execution limit. They each enforce their own 120s cap.
max_execution_time = 360
; Transport ceilings accommodate a 512 MiB video plus multipart overhead.
; Per-media limits and admission quotas remain enforced by MediaIngestService.
; Per-media limits and admission quotas are still enforced in MediaIngestService.
upload_max_filesize = 544M
post_max_size = 576M

; Application code is immutable inside a release container. Avoid a filesystem
; timestamp check for every PHP script on every request; deployment restarts the
; container whenever code changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.save_comments = 1
